[package]
name = "learn-cv-with-me"
version = "0.1.0"
authors = ["Emmanuel-A-SDE <aemmanuel@cormetrix.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = ["router"] }

[features]
default = ["web"]
web = ["dioxus/web"]
